# Netlify builds and serves the site from `main`. The Next.js runtime is
# requested explicitly below: with a build command and a publish directory
# set here, Netlify skipped its own framework detection and published the
# raw .next folder as static files, so every route 404'd. The runtime turns
# that build into pages, server actions (the forms), the proxy (language
# redirects) and the headers from next.config.ts.
#
# Environment variables are set in the Netlify UI, never here:
#   RESEND_API_KEY  required for the forms to deliver (see src/lib/mailer.ts)
#   MAIL_TO         optional, defaults to CONTACT_EMAIL
#   MAIL_FROM       optional, e.g. "4TUN Hub <hello@4tunhub.com>" once the
#                   domain is verified in Resend
#   ANALYTICS_PROVIDER, ANALYTICS_SITE_ID, ANALYTICS_HOST
#                   optional, cookieless analytics (see src/lib/analytics.ts).
#                   Read at build time: add them, then redeploy.

[build]
  command = "npm run build"
  publish = ".next"
  # A production deploy costs 15 credits flat, whatever the build takes, so
  # 300 credits a month is 20 deploys and nothing else. On 2026-09-20 eleven
  # deploys in two days had eaten 165 of them; every other line on the bill —
  # compute, bandwidth, 9,354 web requests — came to 7.2 credits together.
  #
  # So: skip the deploy when a commit cannot change what is served. `docs/`
  # and loose markdown are read by people, not shipped. `src/lib/blueprint.ts`
  # deliberately is NOT excluded — /blueprint renders it.
  #
  # Exit 0 skips the build. The guard matters: on the first build after a
  # cache reset CACHED_COMMIT_REF is empty, and a bare `git diff` would then
  # compare against nothing, exit 0, and skip a deploy that was needed. With
  # the guard an empty ref fails open and builds.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)docs/" ":(exclude)*.md"'

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
