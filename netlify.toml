# Netlify builds and serves the site from `main`. The Next.js runtime is
# requested explicitly below: with a build command and a publish directory
# set here, Netlify skipped its own framework detection and published the
# raw .next folder as static files, so every route 404'd. The runtime turns
# that build into pages, server actions (the forms), the proxy (language
# redirects) and the headers from next.config.ts.
#
# Environment variables are set in the Netlify UI, never here:
#   RESEND_API_KEY  required for the forms to deliver (see src/lib/mailer.ts)
#   MAIL_TO         optional, defaults to CONTACT_EMAIL
#   MAIL_FROM       optional, e.g. "4TUN Hub <hello@4tunhub.com>" once the
#                   domain is verified in Resend
#   ANALYTICS_PROVIDER, ANALYTICS_SITE_ID, ANALYTICS_HOST
#                   optional, cookieless analytics (see src/lib/analytics.ts).
#                   Read at build time: add them, then redeploy.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
