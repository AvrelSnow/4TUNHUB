<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="ttl">
<title id="ttl">P003 driven plate: dimensioned schematic, not to scale</title>
<style>
  :root{ --ink:#1b1f24; --thin:#5b6672; --accent:#a8710a; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e8edf2; --thin:#97a3b0; --accent:#ffc01f; } }
  @media print{ :root{ --ink:#1b1f24; --thin:#5b6672; --accent:#a8710a; } }
  .part{fill:none;stroke:var(--ink);stroke-width:2.2}
  .hid{fill:none;stroke:var(--thin);stroke-width:1.3;stroke-dasharray:6 4}
  .ctr{stroke:var(--thin);stroke-width:.9;stroke-dasharray:9 3 2 3}
  .ext{stroke:var(--thin);stroke-width:.9}
  .dim{stroke:var(--thin);stroke-width:1.1;marker-start:url(#a);marker-end:url(#a)}
  text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:var(--ink);font-size:14px}
  .val{fill:var(--accent);font-weight:600}
  .note{font-size:12px;fill:var(--thin)}
  .vw{font-size:12px;fill:var(--thin);letter-spacing:.12em}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--thin)"/></marker></defs>
<text class="vw" x="40" y="26">PLAN VIEW</text>
<rect class="part" x="40" y="60" width="500" height="100"/><line class="ctr" x1="28" y1="110" x2="552" y2="110"/>
<circle class="part" cx="90" cy="110" r="16"/><line class="ctr" x1="90" y1="94" x2="90" y2="126"/>
<circle class="part" cx="190" cy="110" r="16"/><line class="ctr" x1="190" y1="94" x2="190" y2="126"/>
<circle class="part" cx="290" cy="110" r="16"/><line class="ctr" x1="290" y1="94" x2="290" y2="126"/>
<circle class="part" cx="390" cy="110" r="16"/><line class="ctr" x1="390" y1="94" x2="390" y2="126"/>
<circle class="part" cx="490" cy="110" r="16"/><line class="ctr" x1="490" y1="94" x2="490" y2="126"/>
<line class="ext" x1="40" y1="160" x2="40" y2="196"/><line class="ext" x1="90" y1="160" x2="90" y2="196"/><line class="dim" x1="40" y1="192" x2="90" y2="192"/><text class="val" x="65" y="186" text-anchor="middle">{{e}}</text>
<line class="ext" x1="90" y1="160" x2="90" y2="196"/><line class="ext" x1="190" y1="160" x2="190" y2="196"/><line class="dim" x1="90" y1="192" x2="190" y2="192"/><text class="val" x="140" y="186" text-anchor="middle">{{s}}</text>
<line class="ext" x1="490" y1="160" x2="490" y2="196"/><line class="ext" x1="540" y1="160" x2="540" y2="196"/><line class="dim" x1="490" y1="192" x2="540" y2="192"/><text class="val" x="515" y="186" text-anchor="middle">{{e}}</text>
<text class="note" x="340" y="192" text-anchor="middle">&#8230;</text>
<line class="ext" x1="40" y1="60" x2="20" y2="60"/><line class="ext" x1="40" y1="160" x2="20" y2="160"/><line class="dim" x1="24" y1="60" x2="24" y2="160"/><text class="val" x="18" y="115" text-anchor="end">{{W}}</text>
<text class="val" x="290" y="48" text-anchor="middle">{{n}} holes &#8960; {{d}}, thickness {{t}}</text>
<text class="note" x="40" y="228">The length is not given: it follows from e, s and n. The picture shows five holes whatever n is.</text>
</svg>
