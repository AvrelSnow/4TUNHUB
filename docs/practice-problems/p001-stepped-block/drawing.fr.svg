<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="ttl">
<title id="ttl">P001 bloc étagé : schéma coté, hors échelle</title>
<style>
  :root{ --ink:#1b1f24; --thin:#5b6672; --accent:#a8710a; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e8edf2; --thin:#97a3b0; --accent:#ffc01f; } }
  @media print{ :root{ --ink:#1b1f24; --thin:#5b6672; --accent:#a8710a; } }
  .part{fill:none;stroke:var(--ink);stroke-width:2.2}
  .hid{fill:none;stroke:var(--thin);stroke-width:1.3;stroke-dasharray:6 4}
  .ctr{stroke:var(--thin);stroke-width:.9;stroke-dasharray:9 3 2 3}
  .ext{stroke:var(--thin);stroke-width:.9}
  .dim{stroke:var(--thin);stroke-width:1.1;marker-start:url(#a);marker-end:url(#a)}
  text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:var(--ink);font-size:14px}
  .val{fill:var(--accent);font-weight:600}
  .note{font-size:12px;fill:var(--thin)}
  .vw{font-size:12px;fill:var(--thin);letter-spacing:.12em}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--thin)"/></marker></defs>
<text class="vw" x="40" y="26">VUE DE FACE</text>
<rect class="part" x="40" y="130" width="220" height="60"/><rect class="part" x="110" y="90" width="80" height="40"/><line class="hid" x1="140" y1="90" x2="140" y2="190"/><line class="hid" x1="160" y1="90" x2="160" y2="190"/><line class="ctr" x1="150" y1="78" x2="150" y2="202"/>
<line class="ext" x1="40" y1="190" x2="40" y2="230"/><line class="ext" x1="260" y1="190" x2="260" y2="230"/><line class="dim" x1="40" y1="226" x2="260" y2="226"/><text class="val" x="150" y="220" text-anchor="middle">{{L}}</text>
<line class="ext" x1="40" y1="130" x2="18" y2="130"/><line class="ext" x1="40" y1="190" x2="18" y2="190"/><line class="dim" x1="22" y1="130" x2="22" y2="190"/><text class="val" x="16" y="165" text-anchor="end">{{H}}</text>
<line class="ext" x1="190" y1="90" x2="294" y2="90"/><line class="ext" x1="190" y1="130" x2="294" y2="130"/><line class="dim" x1="290" y1="90" x2="290" y2="130"/><text class="val" x="296" y="115" text-anchor="start">{{hb}}</text>
<line class="ext" x1="110" y1="90" x2="110" y2="70"/><line class="ext" x1="190" y1="90" x2="190" y2="70"/><line class="dim" x1="110" y1="66" x2="190" y2="66"/><text class="val" x="150" y="60" text-anchor="middle">&#8960; {{Db}}</text>
<text class="val" x="150" y="262" text-anchor="middle">trou &#8960; {{dh}}, traversant bossage et bloc</text>
<text class="vw" x="340" y="26">VUE DE DESSUS</text>
<rect class="part" x="340" y="60" width="240" height="130"/><circle class="part" cx="460" cy="125" r="40"/><circle class="hid" cx="460" cy="125" r="12"/><line class="ctr" x1="330" y1="125" x2="590" y2="125"/><line class="ctr" x1="460" y1="50" x2="460" y2="200"/>
<line class="ext" x1="340" y1="190" x2="340" y2="230"/><line class="ext" x1="580" y1="190" x2="580" y2="230"/><line class="dim" x1="340" y1="226" x2="580" y2="226"/><text class="val" x="460" y="220" text-anchor="middle">{{L}}</text>
<line class="ext" x1="580" y1="60" x2="614" y2="60"/><line class="ext" x1="580" y1="190" x2="614" y2="190"/><line class="dim" x1="610" y1="60" x2="610" y2="190"/><text class="val" x="616" y="130" text-anchor="start">{{W}}</text>
<text class="note" x="40" y="300">Origine : milieu de la face inférieure du bloc. Millimètres. Formes et proportions schématiques.</text>
